name: CVA6 Toolchain (GCC 13.1.0, -mtune=cva6) · Rocky 9 · stable

# Builds the pinned CVA6 toolchain on Rocky 9, monthly. Pins live in _build-cva6-rocky9.yaml.

on:
  schedule:
    - cron: "0 3 1 * *"    # 03:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rv64-cva6-rocky9:
    permissions:
      contents: write    # publish the GitHub Release
    uses: ./.github/workflows/_build-cva6-rocky9.yaml
    with:
      retention_days: 40
